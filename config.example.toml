signal_cli_url = "http://127.0.0.1:8080"

monitor_group_id = "REPLACE_WITH_MONITOR_GROUP_ID"
report_group_id = "REPLACE_WITH_REPORT_GROUP_ID"

# Administrative commands work only in this group and only for this explicit
# ACI UUID allowlist. An empty allowlist disables command control.
command_group_id = "REPLACE_WITH_COMMAND_GROUP_ID"
command_author_uuids = []

trigger_texts = [
    "Всі в укритті?"
]

# Empty means any sender. An explicit ACI UUID allowlist is strongly recommended.
trigger_author_uuids = []

accepted_reactions = [
    "➕"
]

# Add a configured accepted reaction from the ShelterCheck host account when an
# authorized trigger_text is received. Old configs without this key default to true.
auto_host_reaction = true

# Optional intermediate status report. Set to false to skip it completely.
intermediate_check_enabled = true
intermediate_check_seconds = 300

# 10 min authoritative final, 6 h silent active-check TTL.
wait_seconds = 600
active_check_ttl_seconds = 21600
state_db = "/var/lib/sheltercheck/state.sqlite3"
roster_file = "/var/lib/sheltercheck/roster.csv"
released_file = "/var/lib/sheltercheck/released_today.txt"

# HTTP timeouts and receive-side SSE reconnect behavior (not outgoing write retries).
connect_timeout_seconds = 5.0
request_timeout_seconds = 30.0
sse_read_timeout_seconds = 90.0
reconnect_initial_seconds = 1.0
reconnect_max_seconds = 30.0
edit_debounce_seconds = 1.0
