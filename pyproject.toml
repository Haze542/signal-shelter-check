[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-shelter-check"
version = "0.1.0"
description = "Track Signal shelter-check reactions through signal-cli"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[project.scripts]
sheltercheck = "sheltercheck.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

